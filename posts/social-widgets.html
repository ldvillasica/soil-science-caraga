<div id="lyket-wrapper" style="margin: 40px auto; padding-top: 20px; border-top: 1px solid #eee; text-align: center;">
  <p style="font-size: 0.9em; color: #666; font-style: italic;">Like this story? Give it a heart!</p>
  <div id="lyket-btn" data-lyket-type="like" data-lyket-namespace="soil-science-caraga" data-lyket-template="twitter"></div>
</div>

<script>
  (function() {
    var lyketBtn = document.getElementById('lyket-btn');
    var pathId = window.location.pathname.split('/').filter(Boolean).pop() || "home";
    lyketBtn.setAttribute('data-lyket-id', pathId);
  })();
</script>

<script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_163e0eed8c09ddd45c012c0fa35c29"></script>

<script>
  window.addEventListener("load", function() {
    var lyketWrapper = document.getElementById('lyket-wrapper');
    var postContent = document.querySelector('main.content') || document.querySelector('article');
    if (lyketWrapper && postContent) { postContent.appendChild(lyketWrapper); }
  });
</script>
